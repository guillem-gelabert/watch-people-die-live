<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch People Die — Crude Death Rate world map</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Watch People Die, Live</h1>
      <p id="subtitle">Crude Death Rate by country — deaths per 1,000 population</p>
      <div id="sample-banner" class="banner hidden"></div>
    </header>

    <main>
      <div id="status">Loading data…</div>
      <div id="map-wrap">
        <svg id="map" role="img" aria-label="World map of crude death rate"></svg>
        <div id="legend"></div>
      </div>
    </main>

    <footer>
      Source:
      <a
        href="https://data.worldbank.org/indicator/SP.DYN.CDRT.IN"
        target="_blank"
        rel="noopener"
        >World Bank — Death rate, crude (per 1,000 people)</a
      >
    </footer>

    <div id="tooltip" class="hidden"></div>

    <script src="/vendor/d3.min.js"></script>
    <script src="/vendor/topojson-client.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
