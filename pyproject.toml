[project]
name = "watch-people-die-live-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "rasterio>=1.3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "requests>=2.31",
]

# Tooling that is not part of the pipeline itself. Pillow is here for scripts/build_favicon.py,
# which reads the globe's own Earth texture and writes the site icon.
[dependency-groups]
dev = [
    "pillow>=11.0",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [".ipynb_checkpoints", "archive"]

[tool.ruff.lint]
# Defects only (unused/undefined names, real bug patterns) -- no style rules (E501 line
# length, I001 import order, ...). Notebooks legitimately import mid-file after a
# sys.path.insert() setup cell, so E402 would misfire as a style rule here too.
select = ["F", "E9", "B"]
# B018 (bare expression) is the standard, idiomatic way to display a dataframe/value as a
# cell's output in a notebook -- not a bug there, unlike in a plain script.
ignore = ["B018"]
